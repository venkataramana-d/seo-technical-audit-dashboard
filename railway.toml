# Railway config for the always-on crawl worker (M2 T2.1).
# Only Railway reads this file; Vercel (the Next.js frontend) ignores it, so the
# two deploy targets don't conflict. Railway builds the worker image from
# worker/Dockerfile and keeps `python -m worker` running.
#
# Set DATABASE_URL (your Neon connection string) in the Railway service's
# variables. See DEPLOY-WORKER.md for the full setup.

[build]
builder = "DOCKERFILE"
dockerfilePath = "worker/Dockerfile"

[deploy]
startCommand = "python -m worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
